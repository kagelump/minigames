<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Dot Reflex</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #151c2f;
      --panel2: #1d263d;
      --border: #33405c;
      --text: #f8fafc;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --good: #22c55e;
      --bad: #ef4444;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
    }

    button, select { font: inherit; color: inherit; }
    button { cursor: pointer; }

    #game {
      width: min(100%, 560px);
      padding: max(18px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    }

    .topbar { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 14px; }
    .muted { color: var(--muted); font-size: 14px; }
    .pair { margin-top: 2px; font-weight: 700; font-size: 20px; }
    .stats { text-align: right; font-size: 14px; line-height: 1.5; }
    .timer-track { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
    .timer-bar { height: 100%; width: 100%; background: var(--accent); transform-origin: left; }

    .field {
      position: relative;
      height: min(55vh, 360px);
      min-height: 260px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--panel);
      transition: background 100ms ease;
    }
    .field.good { background: #12351f; }
    .field.bad { background: #3a171c; }
    .dot { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
    .center-panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
    .card { width: min(100%, 360px); padding: 24px; border: 1px solid var(--border); border-radius: 20px; background: rgba(21, 28, 47, 0.96); text-align: center; }
    h1, h2 { margin: 0 0 10px; }
    h1 { font-size: 28px; }
    h2 { font-size: 24px; }
    .description { margin: 0 0 22px; color: var(--muted); line-height: 1.45; }
    label { display: block; text-align: left; font-size: 14px; font-weight: 650; margin-bottom: 8px; }
    select { width: 100%; min-height: 52px; padding: 0 14px; margin-bottom: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel2); font-size: 17px; }
    .primary { width: 100%; min-height: 54px; border: 0; border-radius: 14px; background: var(--accent); color: #07111f; font-weight: 800; font-size: 17px; }
    .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .answer { min-height: 100px; border: 1px solid var(--border); border-radius: 20px; background: var(--panel2); font-size: 38px; font-weight: 800; touch-action: manipulation; }
    .answer:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.45; cursor: default; }
    .footer { margin-top: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
    .footer-stats { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .secondary { min-height: 46px; padding: 0 16px; border-radius: 13px; border: 1px solid var(--border); background: transparent; font-weight: 650; white-space: nowrap; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
    .summary-number { font-size: 22px; font-weight: 800; }
    .summary-label { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .summary-detail { margin: 7px 0; color: var(--muted); font-size: 14px; }
    .summary-detail strong { color: var(--text); }
    .hidden { display: none !important; }

    @media (max-height: 680px) {
      .field { height: 300px; }
      .answer { min-height: 82px; }
    }
    @media (prefers-reduced-motion: reduce) { .field { transition: none; } }
  </style>
</head>
<body>
  <main id="game">
    <div class="topbar">
      <div>
        <div class="muted">Level <span id="level">1</span></div>
        <div class="pair"><span id="low">1</span> vs <span id="high">2</span></div>
      </div>
      <div class="stats">
        <div><span class="muted">Score</span> <strong id="score">0</strong></div>
        <div><span class="muted">Streak</span> <strong id="streak">0</strong></div>
      </div>
    </div>

    <div class="timer-track"><div id="timer" class="timer-bar"></div></div>

    <section id="field" class="field">
      <div id="start-screen" class="center-panel">
        <div class="card">
          <h1>Dot Reflex</h1>
          <p class="description">Count the dots and tap the correct number before time runs out. Every 10 rounds increases the numbers by one.</p>
          <label for="time-limit">Time per round</label>
          <select id="time-limit">
            <option value="500">0.5 seconds</option>
            <option value="750">0.75 seconds</option>
            <option value="1000" selected>1 second</option>
            <option value="1250">1.25 seconds</option>
            <option value="1500">1.5 seconds</option>
            <option value="2000">2 seconds</option>
            <option value="3000">3 seconds</option>
          </select>
          <button id="start" class="primary">Start Game</button>
        </div>
      </div>

      <div id="summary-screen" class="center-panel hidden">
        <div class="card">
          <div class="muted">Level complete</div>
          <h2 id="summary-pair">1 vs 2</h2>
          <div class="summary-grid">
            <div><div id="summary-correct" class="summary-number">0/10</div><div class="summary-label">Correct</div></div>
            <div><div id="summary-points" class="summary-number">0</div><div class="summary-label">Points</div></div>
            <div><div id="summary-streak" class="summary-number">0</div><div class="summary-label">Best streak</div></div>
          </div>
          <div class="summary-detail">Time limit: <strong id="summary-time">1.0s</strong></div>
          <div class="summary-detail">Next: <strong id="next-pair">2 vs 3</strong></div>
          <div style="height:14px"></div>
          <button id="continue" class="primary">Continue</button>
        </div>
      </div>
    </section>

    <div class="answers">
      <button id="left" class="answer" disabled>1</button>
      <button id="right" class="answer" disabled>2</button>
    </div>

    <div class="footer">
      <div class="footer-stats">Round <span id="round">0</span>/10 · Accuracy <span id="accuracy">—</span> · <span id="active-limit">1.0s</span></div>
      <button id="reset" class="secondary">New Game</button>
    </div>
  </main>

  <script>
    (() => {
      const field = document.querySelector("#field");
      const startScreen = document.querySelector("#start-screen");
      const summaryScreen = document.querySelector("#summary-screen");
      const startButton = document.querySelector("#start");
      const continueButton = document.querySelector("#continue");
      const resetButton = document.querySelector("#reset");
      const leftButton = document.querySelector("#left");
      const rightButton = document.querySelector("#right");
      const timeSelect = document.querySelector("#time-limit");
      const timerBar = document.querySelector("#timer");
      const levelEl = document.querySelector("#level");
      const lowEl = document.querySelector("#low");
      const highEl = document.querySelector("#high");
      const scoreEl = document.querySelector("#score");
      const streakEl = document.querySelector("#streak");
      const roundEl = document.querySelector("#round");
      const accuracyEl = document.querySelector("#accuracy");
      const activeLimitEl = document.querySelector("#active-limit");
      const summaryPairEl = document.querySelector("#summary-pair");
      const summaryCorrectEl = document.querySelector("#summary-correct");
      const summaryPointsEl = document.querySelector("#summary-points");
      const summaryStreakEl = document.querySelector("#summary-streak");
      const summaryTimeEl = document.querySelector("#summary-time");
      const nextPairEl = document.querySelector("#next-pair");

      const COLORS = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#14b8a6", "#06b6d4", "#3b82f6", "#6366f1", "#8b5cf6", "#d946ef", "#ec4899"];

      let timeLimit = 1000;
      let level = 1;
      let round = 0;
      let score = 0;
      let streak = 0;
      let totalCorrect = 0;
      let totalAttempts = 0;
      let levelCorrect = 0;
      let levelBestStreak = 0;
      let levelStartingScore = 0;
      let answer = 1;
      let active = false;
      let locked = false;
      let roundStartedAt = 0;
      let animationFrame = null;
      let transitionTimer = null;

      function formatTime(ms) {
        const seconds = ms / 1000;
        if (Number.isInteger(seconds)) return seconds.toFixed(1) + "s";
        return seconds.toFixed(2).replace(/0$/, "") + "s";
      }

      function randomColor() {
        return COLORS[Math.floor(Math.random() * COLORS.length)];
      }

      function updateUI() {
        const low = level;
        const high = level + 1;
        levelEl.textContent = level;
        lowEl.textContent = low;
        highEl.textContent = high;
        leftButton.textContent = low;
        rightButton.textContent = high;
        scoreEl.textContent = score;
        streakEl.textContent = streak;
        roundEl.textContent = round;
        activeLimitEl.textContent = formatTime(timeLimit);
        accuracyEl.textContent = totalAttempts === 0
          ? "—"
          : Math.round((totalCorrect / totalAttempts) * 100) + "%";
      }

      function clearTimers() {
        if (animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
        if (transitionTimer !== null) {
          clearTimeout(transitionTimer);
          transitionTimer = null;
        }
      }

      function clearDots() {
        field.querySelectorAll(".dot").forEach(dot => dot.remove());
      }

      function placeDots(count) {
        clearDots();
        const rect = field.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;
        const radius = count >= 15 ? 9 : count >= 10 ? 11 : count >= 6 ? 13 : 16;
        const minimumDistance = radius * 2.8;
        const points = [];

        for (let i = 0; i < count; i++) {
          let x;
          let y;
          let attempts = 0;
          do {
            x = radius + 14 + Math.random() * (width - radius * 2 - 28);
            y = radius + 14 + Math.random() * (height - radius * 2 - 28);
            attempts++;
          } while (attempts < 100 && points.some(point => Math.hypot(point.x - x, point.y - y) < minimumDistance));

          points.push({ x, y });
          const dot = document.createElement("div");
          dot.className = "dot";
          dot.style.width = radius * 2 + "px";
          dot.style.height = radius * 2 + "px";
          dot.style.left = x + "px";
          dot.style.top = y + "px";
          dot.style.background = randomColor();
          field.appendChild(dot);
        }
      }

      function animateTimer(now) {
        if (!active || locked) return;
        const elapsed = now - roundStartedAt;
        const remaining = Math.max(0, 1 - elapsed / timeLimit);
        timerBar.style.transform = `scaleX(${remaining})`;
        if (elapsed >= timeLimit) {
          finishRound(null);
          return;
        }
        animationFrame = requestAnimationFrame(animateTimer);
      }

      function startRound() {
        clearTimers();
        summaryScreen.classList.add("hidden");
        field.classList.remove("good", "bad");
        locked = false;
        active = true;
        const low = level;
        const high = level + 1;
        answer = Math.random() < 0.5 ? low : high;
        placeDots(answer);
        leftButton.disabled = false;
        rightButton.disabled = false;
        timerBar.style.transform = "scaleX(1)";
        roundStartedAt = performance.now();
        animationFrame = requestAnimationFrame(animateTimer);
      }

      function finishRound(choice) {
        if (!active || locked) return;
        locked = true;
        if (animationFrame !== null) cancelAnimationFrame(animationFrame);
        leftButton.disabled = true;
        rightButton.disabled = true;
        totalAttempts++;
        round++;
        const correct = choice === answer;

        if (correct) {
          totalCorrect++;
          levelCorrect++;
          streak++;
          levelBestStreak = Math.max(levelBestStreak, streak);
          score += 100 + Math.min(400, streak * 10);
          field.classList.add("good");
        } else {
          streak = 0;
          field.classList.add("bad");
        }

        updateUI();
        if (round >= 10) {
          transitionTimer = setTimeout(showLevelSummary, 300);
        } else {
          transitionTimer = setTimeout(startRound, 250);
        }
      }

      function showLevelSummary() {
        clearTimers();
        active = false;
        locked = true;
        leftButton.disabled = true;
        rightButton.disabled = true;
        clearDots();
        field.classList.remove("good", "bad");
        timerBar.style.transform = "scaleX(0)";
        const levelPoints = score - levelStartingScore;
        summaryPairEl.textContent = `${level} vs ${level + 1}`;
        summaryCorrectEl.textContent = `${levelCorrect}/10`;
        summaryPointsEl.textContent = levelPoints;
        summaryStreakEl.textContent = levelBestStreak;
        summaryTimeEl.textContent = formatTime(timeLimit);
        nextPairEl.textContent = `${level + 1} vs ${level + 2}`;
        summaryScreen.classList.remove("hidden");
      }

      function continueToNextLevel() {
        level++;
        round = 0;
        levelCorrect = 0;
        levelBestStreak = 0;
        levelStartingScore = score;
        updateUI();
        startRound();
      }

      function startGame() {
        timeLimit = Number.parseInt(timeSelect.value, 10);
        level = 1;
        round = 0;
        score = 0;
        streak = 0;
        totalCorrect = 0;
        totalAttempts = 0;
        levelCorrect = 0;
        levelBestStreak = 0;
        levelStartingScore = 0;
        startScreen.classList.add("hidden");
        summaryScreen.classList.add("hidden");
        updateUI();
        startRound();
      }

      function resetGame() {
        clearTimers();
        active = false;
        locked = false;
        level = 1;
        round = 0;
        score = 0;
        streak = 0;
        totalCorrect = 0;
        totalAttempts = 0;
        levelCorrect = 0;
        levelBestStreak = 0;
        levelStartingScore = 0;
        clearDots();
        field.classList.remove("good", "bad");
        leftButton.disabled = true;
        rightButton.disabled = true;
        timerBar.style.transform = "scaleX(1)";
        summaryScreen.classList.add("hidden");
        startScreen.classList.remove("hidden");
        updateUI();
      }

      startButton.addEventListener("click", startGame);
      continueButton.addEventListener("click", continueToNextLevel);
      resetButton.addEventListener("click", resetGame);
      leftButton.addEventListener("click", () => finishRound(level));
      rightButton.addEventListener("click", () => finishRound(level + 1));

      document.addEventListener("keydown", event => {
        if (!active || locked) return;
        if (event.key === "ArrowLeft") finishRound(level);
        if (event.key === "ArrowRight") finishRound(level + 1);
      });

      updateUI();
    })();
  </script>
</body>
</html>
